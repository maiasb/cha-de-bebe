<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chá de Bebê do Lennon Henrique 💙</title>
<meta name="description" content="Você está convidado! Chá de Bebê do Lennon, sábado 14/11 às 19h.">
<meta property="og:title" content="Chá de Bebê do Lennon Henrique 💙">
<meta property="og:description" content="Você está convidado! Sábado, 14/11, às 19h.">
<meta property="og:image" content="img/bebe.webp">
<meta name="theme-color" content="#dbeefa">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&family=Fredoka:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --azul:#3a9fd0;
  --azul-escuro:#1f6fa8;
  --azul-claro:#dbeefa;
  --teal:#3a9a9a;
  --texto:#2a5f8a;
  --verde-agua:#e6f1ee;
}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth;overflow-x:clip}
body{
  min-width:0;
  font-family:"Fredoka",system-ui,sans-serif;
  color:var(--texto);
  background:#fbfaf7 url(img/papel.webp) center/cover fixed;
  text-align:center;
  overflow-x:hidden;
}
img{display:block;max-width:100%;height:auto}
section{
  position:relative;
  min-height:100svh;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:3rem 1.25rem;
  overflow:clip;
}
.deco{position:absolute;pointer-events:none;z-index:0}
.conteudo{position:relative;z-index:1;width:100%;max-width:26rem}

/* convite */
.convite .bebe{width:min(62vw,15rem);margin:0 auto}
.script{font-family:"Dancing Script",cursive;font-weight:600;color:var(--azul)}
.titulo{font-size:clamp(2.6rem,11vw,3.6rem);line-height:1;margin-top:.25rem}
.fita{position:relative;width:min(88%,22rem);margin:.4rem auto 0}
.fita span{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-family:"Dancing Script",cursive;font-weight:600;color:#fff;
  font-size:clamp(2.4rem,10vw,3.2rem);padding-bottom:.4rem;
}
.selo{
  display:inline-block;background:var(--teal);color:#fff;font-weight:600;
  padding:.3rem 1.1rem;border-radius:.7rem;margin-top:1.4rem;font-size:1.1rem;
  position:relative;z-index:2;
}
.cartao{
  background:var(--azul-claro);border:2px solid #fff;border-radius:1.6rem;
  box-shadow:0 0 0 2px #c3e0f4;margin-top:-.9rem;padding:1.8rem 1rem 1.2rem;
  display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:.6rem 1.4rem;
  color:var(--azul-escuro);
}
.cartao .data{font-size:clamp(2.2rem,10vw,3rem);font-weight:600;line-height:1}
.cartao .dia{font-size:1.4rem;font-weight:600;letter-spacing:.03em}
.cartao .hora{font-size:1.7rem;font-weight:600}
.acoes{display:flex;flex-wrap:wrap;justify-content:center;gap:1.5rem clamp(1rem,6vw,2.5rem);margin-top:2rem}
.acao{
  display:flex;flex-direction:column;align-items:center;gap:.5rem;
  color:var(--texto);text-decoration:none;font-weight:600;font-size:.95rem;max-width:7.5rem;min-width:0;
  transition:transform .2s;
}
.acao:hover,.acao:focus-visible{transform:translateY(-4px)}
.acao img{height:4.5rem;width:auto;max-width:100%}
.dica{display:flex;flex-direction:column;align-items:center;margin-top:1.2rem;font-size:.9rem;font-weight:600;color:var(--azul-escuro)}
.dica img{width:2.4rem;opacity:.9}

/* urso e presentes */
.urso,.presentes{background:var(--verde-agua) url(img/fundo.webp) center/cover}
.urso{min-height:70svh}
.urso img{width:min(60vw,15rem);margin:0 auto}
.presente{margin-bottom:3rem}
.presente:last-child{margin-bottom:0}
.presente img{height:9rem;width:auto;margin:0 auto 1rem}
.presente h2{font-size:2rem;font-weight:600;color:var(--azul);line-height:1.1}
.presente p{font-size:1rem;font-weight:600;color:var(--azul);margin-top:.3rem}

/* local */
.local{background:var(--azul-claro)}
.local h2{font-size:2.6rem;margin-bottom:1.2rem}
.local img{height:6rem;width:auto;margin:0 auto 1.5rem}
.botao{
  display:inline-block;background:var(--azul);color:#fff;text-decoration:none;font-weight:600;
  padding:.9rem 1.8rem;border-radius:999px;font-size:1.1rem;
  box-shadow:0 4px 0 var(--azul-escuro);transition:transform .15s,box-shadow .15s;
}
.botao:active{transform:translateY(3px);box-shadow:0 1px 0 var(--azul-escuro)}
:focus-visible{outline:3px solid var(--azul-escuro);outline-offset:4px;border-radius:.5rem}
footer{padding:1.5rem;font-size:.9rem;color:var(--azul-escuro);background:var(--azul-claro)}

@media (min-width:48rem){
  .conteudo{max-width:30rem}
  .presentes .conteudo{max-width:56rem;display:grid;grid-template-columns:repeat(3,1fr);gap:2rem}
  .presente{margin:0}
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.acao{transition:none}}
</style>
</head>
<body>

<section class="convite">
  <img class="deco" src="img/nuvem.webp" alt="" style="top:-1rem;left:-4rem;width:12rem">
  <img class="deco" src="img/nuvem.webp" alt="" style="bottom:-2rem;right:-5rem;width:14rem;transform:scaleX(-1)">
  <img class="deco" src="img/estrela.webp" alt="" style="top:22%;left:4%;width:2.2rem">
  <img class="deco" src="img/estrela.webp" alt="" style="top:30%;right:4%;width:3.8rem">
  <img class="deco" src="img/estrela.webp" alt="" style="bottom:18%;left:3%;width:4.2rem">
  <div class="conteudo">
    <img class="bebe" src="img/bebe.webp" alt="Bebê dormindo em um travesseiro ao lado de uma lua" width="420" height="379">
    <h1 class="script titulo">Chá de Bebê</h1>
    <div class="fita">
      <img src="img/fita.webp" alt="" width="450" height="126">
      <span>Lennon</span>
    </div>
    <p class="selo">Você está convidado!</p>
    <div class="cartao">
      <div>
        <div class="data">14/11</div>
        <div class="dia">SÁBADO</div>
      </div>
      <div class="hora">às 19h</div>
    </div>
    <nav class="acoes" aria-label="Informações">
      <a class="acao" href="#presentes">
        <img src="img/fralda.webp" alt="" width="360" height="324">
        Sugestões de presentes
      </a>
      <a class="acao" href="https://maps.app.goo.gl/h47kTwjiRLzRytMP6" target="_blank" rel="noopener">
        <img src="img/local.webp" alt="" width="240" height="240">
        Localização
      </a>
    </nav>
  </div>
</section>

<section class="urso" aria-hidden="true">
  <img src="img/urso.webp" alt="" width="400" height="475">
</section>

<section class="presentes" id="presentes">
  <div class="conteudo">
    <div class="presente">
      <img src="img/fralda.webp" alt="" width="360" height="324">
      <h2>Fraldas</h2>
      <p>Tamanhos: P e M</p>
    </div>
    <div class="presente">
      <img src="img/body.webp" alt="" width="360" height="388">
      <h2>Roupinhas</h2>
      <p>Tamanhos: 0 a 6 meses</p>
    </div>
    <div class="presente">
      <img src="img/chocalho.webp" alt="" width="320" height="513">
      <h2>Mimo de enxoval</h2>
    </div>
  </div>
</section>

<section class="local" id="localizacao">
  <div class="conteudo">
    <h2 class="script">Localização</h2>
    <img src="img/local.webp" alt="" width="240" height="240">
    <a class="botao" href="https://maps.app.goo.gl/h47kTwjiRLzRytMP6" target="_blank" rel="noopener">Abrir no mapa</a>
  </div>
</section>

<footer>Chá de Bebê do Lennon Henrique 💙 · Sábado, 14/11, às 19h</footer>

</body>
</html>
